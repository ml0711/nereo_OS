<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>nereo OS</title>
<link rel="icon" href="/nereo_n_black.svg" type="image/svg+xml" />
<script>
  // bfcache-Guard (wie in der alten Ansicht): nach dem Abmelden darf der Zurück-Button
  // keine gecachte, „noch eingeloggt" wirkende Seite zeigen. Aus dem Cache -> hart neu laden,
  // der Server antwortet dann mit Redirect auf /login, sobald die Session weg ist.
  window.addEventListener("pageshow", function (e) { if (e.persisted) window.location.reload(); });
</script>
<style>
  @font-face{
    font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
    src:url('/inter.woff2') format('woff2');
  }
  :root{
    /* nereo Design-Tokens (Vasco-Prototyp) — zentrale Stelle (CLAUDE.md §3). Helle CI. */
    --bg:#f7f7f7; --bg2:#ffffff; --panel:#ffffff; --panel2:#f1f1f1; --ink:#000000;
    --line:#dedede; --line2:#eeeeee;
    --txt:#111111; --mut:#666666; --mut2:#8a8a8a;
    --acc:#06eddb; --acc2:#0a9d92; --soft:rgba(6,237,219,.12); --soft2:rgba(6,237,219,.055);
    --ok:#1f9d5b; --warn:#c07d1e; --bad:#d94a4a;
    --shadow:0 8px 26px rgba(0,0,0,.055);
    --r-card:5px; --r-list:4px;
    --sb:238px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);
    font:13px/1.5 'Inter','Helvetica Neue',Arial,sans-serif;letter-spacing:-.005em}
  a{color:inherit}

  /* Kopfzeile: weiß, feine Linie unten, schwarzer Text (keine Verläufe) */
  .topbar{position:fixed;top:0;left:0;right:0;height:58px;z-index:20;
    display:flex;align-items:center;gap:14px;padding:0 20px;
    background:#fff;border-bottom:1px solid var(--line)}
  .spacer{flex:1}
  .menu-btn{display:none;font-size:18px;line-height:1;background:#fff;border:1px solid var(--line);
    color:var(--txt);border-radius:var(--r-card);padding:6px 11px;cursor:pointer}
  .menu-btn:hover{border-color:#000}

  /* n. Commander — Eingabefeld ohne Funktion, Hinweis „in Vorbereitung" */
  .commander{display:flex;align-items:center;gap:9px;min-width:0;flex:1;max-width:440px}
  .cmd-input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);
    border-radius:var(--r-card);padding:8px 12px;font:inherit;color:var(--txt)}
  .cmd-input::placeholder{color:var(--mut2)}
  .cmd-input:disabled{cursor:not-allowed;opacity:.85}
  .cmd-hint{font-size:11px;color:var(--mut2);white-space:nowrap;text-transform:uppercase;letter-spacing:.5px}

  .user{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--mut)}
  .user b{color:var(--txt);font-weight:600}
  .avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    background:#000;color:#fff;font-weight:700;font-size:13px;flex:none}
  .btn{display:inline-flex;align-items:center;gap:7px;cursor:pointer;text-decoration:none;
    border:1px solid var(--line);background:#fff;color:var(--txt);
    padding:7px 13px;border-radius:var(--r-card);font-size:13.5px;font-weight:500}
  .btn:hover{border-color:#000}
  .btn.ghost{background:transparent}

  /* Shell + Seitenleiste (WEISS, wie Vasco-Vorlage) */
  .shell{display:flex;min-height:100vh;padding-top:58px}
  .side{position:fixed;top:58px;bottom:0;left:0;width:var(--sb);padding:16px 14px;
    border-right:1px solid var(--line);background:#fff;overflow:auto}
  .side-brand{display:flex;flex-direction:row;align-items:baseline;gap:9px;
    padding:2px 4px 16px;margin-bottom:10px;border-bottom:1px solid var(--line2)}
  .side-logo{height:20px;width:auto;max-width:60%;display:block}
  .side-os{color:var(--mut);font-size:34px;font-weight:300;line-height:1;text-transform:uppercase;letter-spacing:.01em}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-list);
    color:var(--mut);text-decoration:none;font-size:14px;font-weight:500;cursor:pointer;position:relative}
  .nav a .ico{width:18px;text-align:center;color:var(--mut2);font-size:15px;flex:none}
  .nav a:hover{background:#f0f0f0;color:var(--txt)}
  .nav a.active{background:var(--soft);color:var(--txt)}
  .nav a.active .ico{color:var(--txt)}
  .nav a.active::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--acc)}
  /* „In Vorbereitung": gedämpft/grau, aber anklickbar */
  .nav a.prep{color:var(--mut2)}
  .nav a.prep .ico{color:var(--mut2)}
  .nav a.prep:hover{background:#f4f4f4;color:var(--mut)}
  .sec{margin:18px 0 6px;padding:0 12px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut2)}

  /* Hauptbereich */
  .main{flex:1;margin-left:var(--sb);padding:24px 30px;max-width:1280px}
  .ctx-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;
    border-bottom:1px solid var(--line);padding-bottom:14px}
  .ctx-head h2{margin:0;font-size:23px;font-weight:760;color:#000;letter-spacing:-.01em}
  .empty{padding:42px 20px;text-align:center;color:var(--mut2);background:#fff;
    border:1px dashed var(--line);border-radius:var(--r-card)}
  .prep-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);
    box-shadow:var(--shadow);padding:26px;max-width:560px}
  .prep-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:var(--r-list);
    text-transform:uppercase;letter-spacing:.4px;background:var(--soft);color:#065f57;margin-bottom:12px}
  .prep-card h3{margin:0 0 8px;font-size:17px;font-weight:600;color:#000}
  .prep-card p{margin:0;color:var(--mut);font-size:14px}

  /* Schmale Bildschirme: Seitenleiste einklappbar (Off-Canvas) */
  @media(max-width:820px){
    :root{--sb:0px}
    .side{transform:translateX(-100%);transition:transform .2s ease;z-index:30;box-shadow:0 0 40px rgba(0,0,0,.2)}
    .side.open{transform:translateX(0)}
    .main{margin-left:0;padding:18px 14px}
    .menu-btn{display:inline-flex}
    .commander{max-width:none}
    .cmd-hint{display:none}
    .u-text{display:none}
  }
</style>
</head>
<body>
<div class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Menü">☰</button>
  <div class="commander">
    <input class="cmd-input" type="text" placeholder="n. Commander" disabled
           aria-label="n. Commander (in Vorbereitung)" title="in Vorbereitung" />
    <span class="cmd-hint">in Vorbereitung</span>
  </div>
  <div class="spacer"></div>
  <div class="user"><span class="avatar" id="avatar">·</span><span class="u-text">Angemeldet als <b id="who">…</b></span></div>
  <a class="btn ghost" href="/logout">Abmelden</a>
</div>

<div class="shell">
  <aside class="side" id="side">
    <div class="side-brand"><img class="side-logo" src="/logo.svg" alt="nereo" /><span class="side-os">OS</span></div>
    <nav class="nav" id="nav"><!--SIDEBAR--></nav>
  </aside>
  <main class="main">
    <div class="ctx-head"><h2><!--TITLE--></h2></div>
    <div id="view"><!--MAIN--></div>
  </main>
</div>

<script>
  // Identität (Avatar + Name) — read-only, über die vorhandene /api/me.
  fetch("/api/me").then(function(r){return r.ok?r.json():null;}).then(function(d){
    var u=d&&d.user; var name=(u&&(u.name||u.username||u.email||u.sub))||"—";
    document.getElementById("who").textContent=name;
    document.getElementById("avatar").textContent=(name[0]||"·").toUpperCase();
  }).catch(function(){});
  // Mobile: Seitenleiste ein-/ausblenden (auf Desktop ist der Menü-Knopf ausgeblendet).
  document.getElementById("menuBtn").onclick=function(){document.getElementById("side").classList.toggle("open");};
</script>
</body>
</html>
